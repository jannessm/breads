<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bread Banking Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        /* Fallback styles when TailwindCSS CDN is blocked */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fffbeb 0%, #fed7aa 100%);
        }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-grow { flex-grow: 1; }
        .min-h-screen { min-height: 100vh; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .w-full { width: 100%; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-6 { padding: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-8 { margin-top: 2rem; }
        .pt-4 { padding-top: 1rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-4xl { font-size: 2.25rem; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .text-white { color: white; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .rounded { border-radius: 0.25rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-full { border-radius: 9999px; }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .overflow-hidden { overflow: hidden; }
        .hidden { display: none; }
        .block { display: block; }
        .whitespace-nowrap { white-space: nowrap; }
        .transition { transition-property: all; transition-duration: 200ms; }
        .border { border-width: 1px; }
        .border-t { border-top-width: 1px; }
        
        /* Custom colors */
        .bg-amber-600 { background-color: #d97706; }
        .bg-amber-700 { background-color: #b45309; }
        .bg-amber-800 { background-color: #92400e; }
        .bg-white { background-color: white; }
        .bg-green-100 { background-color: #dcfce7; }
        .bg-green-600 { background-color: #16a34a; }
        .bg-blue-600 { background-color: #2563eb; }
        .bg-red-600 { background-color: #dc2626; }
        .text-amber-200 { color: #fde68a; }
        .text-amber-800 { color: #92400e; }
        .text-amber-900 { color: #78350f; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-700 { color: #374151; }
        .text-green-800 { color: #166534; }
        .text-red-600 { color: #dc2626; }
        .border-amber-300 { border-color: #fcd34d; }
        .border-amber-600 { border-color: #d97706; }
        .border-amber-700 { border-color: #b45309; }
        .divide-y > *:not(:first-child) { border-top: 1px solid #fef3c7; }
        
        /* Hover states */
        .hover\:bg-amber-500:hover { background-color: #f59e0b; }
        .hover\:bg-green-500:hover { background-color: #22c55e; }
        .hover\:bg-blue-500:hover { background-color: #3b82f6; }
        .hover\:bg-red-500:hover { background-color: #ef4444; }
        .hover\:bg-amber-50:hover { background-color: #fffbeb; }
        .hover\:text-red-800:hover { color: #991b1b; }
        
        /* Focus states */
        input:focus, select:focus { 
            outline: none; 
            box-shadow: 0 0 0 2px #f59e0b;
        }

        /* Sidebar */
        #sidebar {
            width: 16rem;
            background-color: #92400e;
            color: white;
            padding: 1.5rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body > div { flex-direction: column; }
            #sidebar { width: 100%; }
        }
        
        /* Table styles */
        table { width: 100%; border-collapse: collapse; }
        thead { background-color: #d97706; color: white; }
        th, td { padding: 1rem 1.5rem; text-align: left; }
        tbody tr:hover { background-color: #fffbeb; }
        
        /* Button base */
        button {
            cursor: pointer;
            border: none;
            padding: 0.5rem 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: background-color 200ms;
        }
        
        /* Input base */
        input[type="text"], input[type="number"], input[type="datetime-local"], select {
            padding: 0.75rem;
            border: 1px solid #fcd34d;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <div id="sidebar" class="w-full md:w-64 bg-amber-800 text-white p-6 shadow-lg">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <span>🍞</span> Recipes
            </h2>
            <select id="recipe-selector" size="5" class="w-full p-2 rounded bg-amber-700 text-white border border-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-400 mb-4">
                <!-- Recipes will be dynamically populated here -->
            </select>
            <div class="flex flex-col gap-2">
                <button onclick="loadSelectedRecipe()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 px-4 rounded transition duration-200">
                    Load Recipe
                </button>
                <button onclick="deleteSelectedRecipe()" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-2 px-4 rounded transition duration-200">
                    Delete Recipe
                </button>
            </div>
            
            <!-- Notification Settings -->
            <div class="mt-8 pt-4 border-t border-amber-700">
                <h3 class="text-lg font-semibold mb-3 flex items-center gap-2">
                    <span>🔔</span> Notifications
                </h3>
                <div id="notification-status" class="text-sm text-amber-200 mb-2">
                    Checking status...
                </div>
                <button id="enable-notifications" onclick="enableNotifications()" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2 px-4 rounded transition duration-200 hidden">
                    Enable Notifications
                </button>
                <button id="test-notification" onclick="sendTestNotification()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded transition duration-200 mt-2 hidden">
                    Test Notification
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="flex-grow p-6 md:p-10">
            <h1 class="text-4xl font-bold text-amber-900 mb-8 flex items-center gap-3">
                <span>🥖</span> Bread Banking Planner
            </h1>
            
            <!-- Recipe Name Input -->
            <div id="recipe-name-input" class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold text-amber-800 mb-4">Recipe Details</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="recipe-name" placeholder="Recipe Name" 
                        class="flex-grow p-3 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <button onclick="saveRecipe()" 
                        class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 whitespace-nowrap">
                        💾 Save Recipe
                    </button>
                </div>
            </div>

            <!-- Stage Input -->
            <div id="step-input" class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold text-amber-800 mb-4">Add Stage</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="stage-name" placeholder="Stage Name (e.g., Autolyse)" 
                        class="flex-grow p-3 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <input type="text" id="stage-duration" placeholder="Duration (HH:MM)" 
                        class="w-full sm:w-32 p-3 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <button onclick="addStage()" 
                        class="bg-green-600 hover:bg-green-500 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 whitespace-nowrap">
                        ➕ Add Stage
                    </button>
                </div>
            </div>

            <!-- Start Time Input -->
            <div id="start-time-input" class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold text-amber-800 mb-4">Plan Your Bake</h2>
                <div class="flex flex-col sm:flex-row gap-4 items-end">
                    <div class="flex-grow">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Start Time</label>
                        <input type="datetime-local" id="start-time" 
                            class="w-full p-3 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Notify Before (min)</label>
                        <input type="number" id="notify-before" value="5" min="0" max="60"
                            class="w-full sm:w-24 p-3 border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <button onclick="calculateStepTimes()" 
                        class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 whitespace-nowrap">
                        ⏱️ Calculate & Schedule
                    </button>
                </div>
            </div>

            <!-- Stages Table -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <table id="stages-table" class="w-full">
                    <thead class="bg-amber-600 text-white">
                        <tr>
                            <th class="py-4 px-6 text-left font-semibold">Stage</th>
                            <th class="py-4 px-6 text-left font-semibold">Duration</th>
                            <th class="py-4 px-6 text-left font-semibold">Start Time</th>
                            <th class="py-4 px-6 text-center font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stages-body" class="divide-y divide-amber-100">
                        <!-- Stages will be dynamically added here -->
                    </tbody>
                </table>
                <div id="empty-stages" class="text-center py-12 text-gray-500">
                    <span class="text-4xl mb-4 block">🥯</span>
                    <p>No stages added yet. Add your first stage above!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentRecipe = {
            name: '',
            stages: []
        };
        let subscriptionId = null;
        let swRegistration = null;

        // Initialize on page load
        window.onload = async () => {
            updateRecipeSelector();
            updateEmptyState();
            await initServiceWorker();
            await checkNotificationStatus();
        };

        // Service Worker and Push Notification Setup
        async function initServiceWorker() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                try {
                    swRegistration = await navigator.serviceWorker.register('/sw.js');
                    console.log('Service Worker registered:', swRegistration);
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            } else {
                console.log('Push notifications not supported');
                document.getElementById('notification-status').textContent = 'Not supported in this browser';
            }
        }

        async function checkNotificationStatus() {
            const statusEl = document.getElementById('notification-status');
            const enableBtn = document.getElementById('enable-notifications');
            const testBtn = document.getElementById('test-notification');

            if (!('Notification' in window)) {
                statusEl.textContent = 'Not supported';
                return;
            }

            if (Notification.permission === 'granted') {
                statusEl.textContent = '✅ Enabled';
                statusEl.classList.add('text-green-300');
                testBtn.classList.remove('hidden');
                
                // Try to restore subscription
                if (swRegistration) {
                    const subscription = await swRegistration.pushManager.getSubscription();
                    if (subscription) {
                        subscriptionId = localStorage.getItem('pushSubscriptionId');
                    }
                }
            } else if (Notification.permission === 'denied') {
                statusEl.textContent = '❌ Blocked';
                statusEl.classList.add('text-red-300');
            } else {
                statusEl.textContent = 'Click to enable';
                enableBtn.classList.remove('hidden');
            }
        }

        async function enableNotifications() {
            try {
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    await subscribeToNotifications();
                    await checkNotificationStatus();
                } else {
                    alert('Notification permission denied');
                }
            } catch (error) {
                console.error('Error enabling notifications:', error);
                alert('Failed to enable notifications');
            }
        }

        async function subscribeToNotifications() {
            try {
                // Get VAPID public key from server
                const response = await fetch(`${API_BASE}/api/vapid-public-key`);
                const { publicKey } = await response.json();
                
                // Convert VAPID key to Uint8Array
                const applicationServerKey = urlBase64ToUint8Array(publicKey);
                
                // Subscribe to push notifications
                const subscription = await swRegistration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey
                });
                
                // Send subscription to server
                const subscribeResponse = await fetch(`${API_BASE}/api/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subscription)
                });
                
                const result = await subscribeResponse.json();
                subscriptionId = result.id;
                localStorage.setItem('pushSubscriptionId', subscriptionId);
                
                console.log('Subscribed to push notifications:', subscriptionId);
            } catch (error) {
                console.error('Failed to subscribe to push notifications:', error);
                throw error;
            }
        }

        async function sendTestNotification() {
            if (!subscriptionId) {
                alert('Please enable notifications first');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/test-notification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subscriptionId })
                });
                
                if (response.ok) {
                    console.log('Test notification sent');
                } else {
                    throw new Error('Failed to send test notification');
                }
            } catch (error) {
                console.error('Error sending test notification:', error);
                alert('Failed to send test notification');
            }
        }

        async function scheduleNotifications() {
            if (!subscriptionId) {
                console.log('Notifications not enabled, skipping scheduling');
                return;
            }
            
            const notifyBefore = parseInt(document.getElementById('notify-before').value) || 5;
            
            for (const stage of currentRecipe.stages) {
                if (stage.startTime) {
                    try {
                        await fetch(`${API_BASE}/api/schedule-notification`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                subscriptionId,
                                stageName: stage.name,
                                startTime: stage.startTimeISO,
                                delay: notifyBefore
                            })
                        });
                        console.log(`Notification scheduled for: ${stage.name}`);
                    } catch (error) {
                        console.error(`Failed to schedule notification for ${stage.name}:`, error);
                    }
                }
            }
        }

        // Utility function to convert base64 to Uint8Array
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/-/g, '+')
                .replace(/_/g, '/');
            
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        // Recipe Management Functions
        function addStage() {
            const stageName = document.getElementById('stage-name').value;
            const stageDuration = document.getElementById('stage-duration').value;
            
            if (stageName && stageDuration) {
                currentRecipe.stages.push({
                    name: stageName,
                    duration: stageDuration,
                    startTime: null,
                    startTimeISO: null
                });
                
                updateStagesTable();
                updateEmptyState();
                
                // Clear inputs
                document.getElementById('stage-name').value = '';
                document.getElementById('stage-duration').value = '';
            }
        }

        function removeStage(index) {
            currentRecipe.stages.splice(index, 1);
            updateStagesTable();
            updateEmptyState();
        }

        function updateEmptyState() {
            const emptyState = document.getElementById('empty-stages');
            const table = document.getElementById('stages-table');
            
            if (currentRecipe.stages.length === 0) {
                emptyState.classList.remove('hidden');
                table.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                table.classList.remove('hidden');
            }
        }

        function updateStagesTable() {
            const stagesBody = document.getElementById('stages-body');
            stagesBody.innerHTML = '';
            
            currentRecipe.stages.forEach((stage, index) => {
                const row = stagesBody.insertRow();
                row.className = 'hover:bg-amber-50 transition duration-150';
                
                const nameCell = row.insertCell(0);
                nameCell.className = 'py-4 px-6';
                nameCell.innerHTML = `<span class="font-medium text-amber-900">${stage.name}</span>`;
                
                const durationCell = row.insertCell(1);
                durationCell.className = 'py-4 px-6 text-gray-600';
                durationCell.textContent = stage.duration;
                
                const timeCell = row.insertCell(2);
                timeCell.className = 'py-4 px-6';
                if (stage.startTime) {
                    timeCell.innerHTML = `<span class="bg-green-100 text-green-800 py-1 px-3 rounded-full text-sm font-medium">${stage.startTime}</span>`;
                }
                
                const actionsCell = row.insertCell(3);
                actionsCell.className = 'py-4 px-6 text-center';
                actionsCell.innerHTML = `
                    <button onclick="removeStage(${index})" class="text-red-600 hover:text-red-800 font-medium">
                        🗑️ Remove
                    </button>
                `;
            });
        }

        async function calculateStepTimes() {
            const startTime = new Date(document.getElementById('start-time').value);
            
            if (isNaN(startTime.getTime())) {
                alert('Please select a valid start time');
                return;
            }
            
            let currStartTime = new Date(startTime);

            currentRecipe.stages.forEach((stage, index) => {
                // Parse duration
                const [hours, minutes] = stage.duration.split(':').map(Number);
                
                // Calculate start time for each stage
                if (index === 0) {
                    stage.startTime = startTime.toLocaleString();
                    stage.startTimeISO = startTime.toISOString();
                } else {
                    // Calculate cumulative duration
                    const prevStage = currentRecipe.stages[index - 1];
                    const [prevHours, prevMinutes] = prevStage.duration.split(':').map(Number);
                    
                    // Create a new date by adding previous stage's duration
                    currStartTime.setHours(currStartTime.getHours() + prevHours);
                    currStartTime.setMinutes(currStartTime.getMinutes() + prevMinutes);
                    
                    stage.startTime = currStartTime.toLocaleString();
                    stage.startTimeISO = currStartTime.toISOString();
                }
            });
            
            updateStagesTable();
            
            // Schedule notifications for each stage
            await scheduleNotifications();
            
            if (subscriptionId) {
                alert('✅ Times calculated and notifications scheduled!');
            }
        }

        function saveRecipe() {
            const recipeName = document.getElementById('recipe-name').value;
            
            if (recipeName && currentRecipe.stages.length > 0) {
                currentRecipe.name = recipeName;
                
                // Save to local storage
                let recipes = JSON.parse(localStorage.getItem('breadRecipes') || '[]');
                
                // Check if recipe already exists
                const existingRecipeIndex = recipes.findIndex(r => r.name === recipeName);
                
                if (existingRecipeIndex !== -1) {
                    // Update existing recipe
                    recipes[existingRecipeIndex] = currentRecipe;
                } else {
                    // Add new recipe
                    recipes.push(currentRecipe);
                }
                
                localStorage.setItem('breadRecipes', JSON.stringify(recipes));
                
                // Update recipe selector
                updateRecipeSelector();
                alert('Recipe saved successfully!');
            } else {
                alert('Please enter a recipe name and add at least one stage');
            }
        }

        function updateRecipeSelector() {
            const recipeSelector = document.getElementById('recipe-selector');
            const recipes = JSON.parse(localStorage.getItem('breadRecipes') || '[]');
            
            recipeSelector.innerHTML = '';
            
            recipes.forEach(recipe => {
                const option = document.createElement('option');
                option.value = recipe.name;
                option.textContent = recipe.name;
                option.className = 'py-2';
                recipeSelector.appendChild(option);
            });
        }

        function loadSelectedRecipe() {
            const recipeSelector = document.getElementById('recipe-selector');
            const selectedRecipeName = recipeSelector.value;
            
            if (selectedRecipeName) {
                const recipes = JSON.parse(localStorage.getItem('breadRecipes') || '[]');
                const recipe = recipes.find(r => r.name === selectedRecipeName);
                
                if (recipe) {
                    currentRecipe = {...recipe, stages: recipe.stages.map(s => ({...s}))};
                    
                    // Set recipe name
                    document.getElementById('recipe-name').value = currentRecipe.name;
                    
                    // Update stages table
                    updateStagesTable();
                    updateEmptyState();
                }
            }
        }

        function deleteSelectedRecipe() {
            const recipeSelector = document.getElementById('recipe-selector');
            const selectedRecipeName = recipeSelector.value;
            
            if (selectedRecipeName) {
                if (!confirm(`Are you sure you want to delete "${selectedRecipeName}"?`)) {
                    return;
                }
                
                let recipes = JSON.parse(localStorage.getItem('breadRecipes') || '[]');
                
                // Remove the recipe
                recipes = recipes.filter(r => r.name !== selectedRecipeName);
                
                localStorage.setItem('breadRecipes', JSON.stringify(recipes));
                
                // Reset current recipe and UI
                currentRecipe = { name: '', stages: [] };
                document.getElementById('recipe-name').value = '';
                updateStagesTable();
                updateRecipeSelector();
                updateEmptyState();
            }
        }
    </script>
</body>
</html>
